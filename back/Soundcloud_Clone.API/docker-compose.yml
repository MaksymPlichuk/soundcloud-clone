services:
  db:
    image: postgres:16-alpine
    container_name: soundcloud_clone_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: soundcloud_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soundcloud_clone"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Soundcloud_Clone.API/Dockerfile
    container_name: soundcloud_clone_api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: soundcloud_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5087:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_media:/app/Media

volumes:
  db_data:
  api_media: